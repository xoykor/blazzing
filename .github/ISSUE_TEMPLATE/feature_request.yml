name: Feature request
description: Sugira uma melhoria para o Visual IPTV.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema ou necessidade
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Descreva comportamento, UI e impacto esperado.
    validations:
      required: true
