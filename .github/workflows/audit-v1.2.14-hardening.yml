name: Final audit hardening v1.2.14

on:
  push:
    branches:
      - audit-v1.2.14
    paths:
      - .github/scripts/apply_audit_hardening.py
      - .github/workflows/audit-v1.2.14-hardening.yml

permissions:
  contents: write

jobs:
  harden-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit-v1.2.14

      - name: Apply final hardening
        run: python3 .github/scripts/apply_audit_hardening.py

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config cppcheck libx11-dev libcurl4-openssl-dev libjson-c-dev libsqlite3-dev libjpeg-dev libpng-dev libwebp-dev libssl-dev ffmpeg mpv

      - name: Release build and tests
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-release --parallel 2
          ctest --test-dir build-release --output-on-failure

      - name: Sanitizer build and tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DVIPTV_SANITIZE=ON
          cmake --build build-sanitize --parallel 2
          ctest --test-dir build-sanitize --output-on-failure

      - name: Cppcheck
        run: |
          cppcheck --enable=warning,performance,portability --std=c11 --inline-suppr --suppress=missingIncludeSystem --suppress=unusedFunction -Iinclude src tests 2>cppcheck.txt || true
          cat cppcheck.txt
          if grep -E ': (error|warning):' cppcheck.txt; then exit 1; fi

      - name: GCC analyzer build
        run: |
          cmake -S . -B build-analyzer -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_C_FLAGS='-fanalyzer -Wno-analyzer-too-complex'
          cmake --build build-analyzer --parallel 2

      - name: Commit validated hardening
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "noreply@openai.com"
          git add src include tests
          git diff --cached --check
          git commit -m "fix: harden thumbnails, IPC and external service flows"
          git push origin HEAD:audit-v1.2.14
