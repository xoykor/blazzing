name: Catalog Stage1 Structural

on:
  push:
    branches: [uiux-v1.2.15-stage1-work]
    paths:
      - scripts/catalog_stage1_structural.py
      - .github/workflows/catalog-stage1-structural.yml

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uiux-v1.2.15-stage1-work
          fetch-depth: 0

      - name: Apply structural series navigation patch
        run: python3 scripts/catalog_stage1_structural.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libx11-dev libcurl4-openssl-dev libjson-c-dev libsqlite3-dev \
            libjpeg-dev libpng-dev libwebp-dev libssl-dev ffmpeg mpv

      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Commit functional source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui_x11/x11_app.c
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat(series): add season-first navigation"
          git push origin HEAD:uiux-v1.2.15-stage1-work
