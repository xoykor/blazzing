name: UIUX Visual Finalize

on:
  push:
    branches: [uiux-v1.2.15-visual-work]
    paths:
      - .github/workflows/uiux-visual-finalize.yml

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uiux-v1.2.15-visual-work
          fetch-depth: 0

      - name: Apply validated premium UI patch
        run: |
          python3 scripts/uiux_visual_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ui_x11/x11_app.c')
          s = p.read_text()
          for old, new in [('‹ Voltar','< Voltar'),('▶','>'),('Ⅱ','||'),('← →','<- ->')]:
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libx11-dev libcurl4-openssl-dev libjson-c-dev libsqlite3-dev \
            libjpeg-dev libpng-dev libwebp-dev libssl-dev ffmpeg mpv

      - name: Build and test redesigned application
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Publish validated visual source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui_x11/x11_app.c
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat(ui): redesign IPTV interface"
          git push origin HEAD:uiux-v1.2.15-visual-work
