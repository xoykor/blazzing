name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitize: [OFF, ON]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config python3 \
            libx11-dev libcurl4-openssl-dev libjson-c-dev libsqlite3-dev \
            libjpeg-dev libpng-dev libwebp-dev libssl-dev libcairo2-dev libpango1.0-dev libqrencode-dev ffmpeg mpv

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.sanitize == 'ON' && 'Debug' || 'Release' }}
          -DVIPTV_SANITIZE=${{ matrix.sanitize }}
          -DVIPTV_PAIRING_DEFAULT_URL=https://pair.example.test

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure


  relay-test:
    name: Pairing relay
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.mod

      - name: Test relay
        working-directory: relay
        run: go test ./...

      - name: Validate Oracle installer
        run: bash -n relay/deploy/install-oracle-ubuntu.sh

      - name: Build relay
        working-directory: relay
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/blazzing-pairing-relay .

      - name: Smoke-test relay binary
        run: |
          BLZ_RELAY_ADDR=127.0.0.1:18080 /tmp/blazzing-pairing-relay >/tmp/blazzing-relay.log 2>&1 &
          relay_pid=$!
          trap 'kill "$relay_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:18080/healthz; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/blazzing-relay.log
          exit 1
