name: Apply v1.2.14 audit fixes

on:
  push:
    branches:
      - audit-v1.2.14
    paths:
      - .github/workflows/audit-v1.2.14-apply.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit-v1.2.14

      - name: Apply audited fixes
        run: python3 .github/scripts/apply_audit_v1_2_14.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config python3 libx11-dev libcurl4-openssl-dev libjson-c-dev libsqlite3-dev libjpeg-dev libpng-dev libwebp-dev libssl-dev ffmpeg mpv

      - name: Build and test release
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DVIPTV_SANITIZE=OFF
          cmake --build build-release --parallel 2
          ctest --test-dir build-release --output-on-failure

      - name: Build and test sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DVIPTV_SANITIZE=ON
          cmake --build build-sanitize --parallel 2
          ctest --test-dir build-sanitize --output-on-failure

      - name: Commit validated audit fixes
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "noreply@openai.com"
          git add src tests
          git diff --cached --check
          git commit -m "fix: harden UI, player, thumbnails and provider flows"
          git push origin HEAD:audit-v1.2.14
