        if (sym == XK_Tab) { a->input_focus = INPUT_SEARCH; return; }
        if (sym == XK_BackSpace) { a->input_focus = INPUT_SEARCH; backspace_input(a); return; }
        if (printable) { a->input_focus = INPUT_SEARCH; append_input(a, buf, (size_t)n); return; }
