name: Revamp visual QA

on:
  push:
    branches: [revamp-v1.3.0]
    paths:
      - .github/workflows/revamp-visual-qa.yml
      - src/ui_x11/x11_app.c
      - src/app/pluto_app.c

permissions:
  contents: read

jobs:
  capture-screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libx11-dev libcurl4-openssl-dev libjson-c-dev libsqlite3-dev \
            libjpeg-dev libpng-dev libwebp-dev libssl-dev libcairo2-dev libpango1.0-dev \
            ffmpeg mpv xvfb xauth imagemagick xdotool
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Capture IPTV and Pluto screens
        run: |
          mkdir -p visual-artifacts
          xvfb-run -a -s '-screen 0 1600x900x24' bash -lc '
            set -u

            ./build/visual-iptv >visual-artifacts/iptv.log 2>&1 &
            app=$!
            sleep 2
            hub=$(xdotool search --name "^Blazzing$" 2>/dev/null | head -n1 || true)
            if [ -n "$hub" ]; then
              xdotool key --window "$hub" Return || true
            fi
            sleep 3
            import -window root visual-artifacts/iptv-login.png
            kill "$app" 2>/dev/null || true
            wait "$app" 2>/dev/null || true

            ./build/visual-iptv >visual-artifacts/pluto.log 2>&1 &
            app=$!
            sleep 2
            hub=$(xdotool search --name "^Blazzing$" 2>/dev/null | head -n1 || true)
            if [ -n "$hub" ]; then
              xdotool key --window "$hub" Right || true
              sleep 1
              xdotool key --window "$hub" Return || true
            fi
            sleep 10
            import -window root visual-artifacts/pluto.png
            kill "$app" 2>/dev/null || true
            wait "$app" 2>/dev/null || true
          '
          file visual-artifacts/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: revamp-visual-qa-final
          path: visual-artifacts/
          if-no-files-found: error
