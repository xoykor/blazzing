name: Revamp Flatpak check

on:
  push:
    branches: [revamp-v1.3.0]
    paths:
      - .github/workflows/revamp-flatpak-check.yml
      - CMakeLists.txt
      - src/**
      - include/**
      - flatpak/**

permissions:
  contents: read

jobs:
  flatpak-check:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Blazzing-revamp-check-x86_64.flatpak
          manifest-path: flatpak/io.github.xoykor.Blazzing.yml
          cache-key: revamp-flatpak-${{ github.sha }}
          artifact-name: Blazzing-revamp-check-x86_64.flatpak
