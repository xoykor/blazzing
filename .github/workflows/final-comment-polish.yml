name: Final comment polish

on:
  push:
    branches: [final-maintenance]
    paths:
      - 'scripts/final-comment-polish.py'
      - '.github/workflows/final-comment-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-maintenance

      - name: Polish generated comments
        run: python3 scripts/final-comment-polish.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential cmake pkg-config             libx11-dev libcurl4-openssl-dev libjson-c-dev libsqlite3-dev             libjpeg-dev libpng-dev libwebp-dev libssl-dev libcairo2-dev libpango1.0-dev             ffmpeg mpv

      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Commit comment polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include src tests
          git diff --cached --quiet && exit 0
          git commit -m 'docs(code): explain even straightforward helpers'
          git push origin HEAD:final-maintenance
