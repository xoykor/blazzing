name: Final maintenance audit

on:
  push:
    branches: [final-maintenance]
    paths:
      - '.github/workflows/final-maintenance-audit.yml'
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies and analyzers
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential cmake ninja-build pkg-config             libx11-dev libcurl4-openssl-dev libjson-c-dev libsqlite3-dev             libjpeg-dev libpng-dev libwebp-dev libssl-dev libcairo2-dev libpango1.0-dev             ffmpeg mpv cppcheck clang clang-tools python3

      - name: Normal build and tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: ASan and UBSan
        run: |
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVIPTV_SANITIZE=ON
          cmake --build build-san
          ctest --test-dir build-san --output-on-failure

      - name: Cppcheck
        continue-on-error: true
        run: |
          mkdir -p audit
          cppcheck             --enable=warning,performance,portability             --std=c11             --force             --inline-suppr             --suppress=missingIncludeSystem             -Iinclude             src include tests             2> audit/cppcheck.txt
          cat audit/cppcheck.txt

      - name: GCC static analyzer
        continue-on-error: true
        run: |
          cmake -S . -B build-gcc-analyzer -G Ninja             -DCMAKE_BUILD_TYPE=Debug             -DCMAKE_C_FLAGS="-fanalyzer -Wall -Wextra -Wpedantic"
          cmake --build build-gcc-analyzer 2>&1 | tee audit/gcc-analyzer.txt

      - name: Clang static analyzer
        continue-on-error: true
        run: |
          cmake -S . -B build-clang -G Ninja             -DCMAKE_BUILD_TYPE=Debug             -DCMAKE_C_COMPILER=clang
          scan-build --status-bugs --keep-going             -o audit/scan-build             cmake --build build-clang 2>&1 | tee audit/clang-analyzer.txt

      - name: Comment coverage report
        run: |
          python3 - <<'PY' | tee audit/comment-coverage.txt
          from pathlib import Path
          import re

          files = sorted(list(Path("src").rglob("*.c")) + list(Path("include").rglob("*.h")))
          total_code = total_comment = total_functions = documented_functions = 0

          fn_re = re.compile(
              r"^\s*(?:static\s+)?(?:const\s+)?(?:unsigned\s+|signed\s+)?"
              r"(?:void|bool|char|int|long|size_t|double|float|vip_[A-Za-z0-9_]+(?:\s*\*)?|"
              r"[A-Za-z_][A-Za-z0-9_]*\s*\*)\s+"
              r"[A-Za-z_][A-Za-z0-9_]*\s*\([^;]*\)\s*\{"
          )

          print("file\tcode_lines\tcomment_lines\tcomment_pct\tfunctions\tdocumented_functions")
          for path in files:
              lines = path.read_text(errors="replace").splitlines()
              code = 0
              comments = 0
              in_block = False
              functions = 0
              documented = 0

              for i, line in enumerate(lines):
                  stripped = line.strip()
                  if in_block:
                      comments += 1
                      if "*/" in stripped:
                          in_block = False
                      continue
                  if stripped.startswith("/*"):
                      comments += 1
                      if "*/" not in stripped:
                          in_block = True
                      continue
                  if stripped.startswith("//"):
                      comments += 1
                      continue
                  if stripped:
                      code += 1

                  if fn_re.match(line):
                      functions += 1
                      j = i - 1
                      while j >= 0 and not lines[j].strip():
                          j -= 1
                      if j >= 0:
                          prev = lines[j].strip()
                          if prev.startswith("//") or prev.endswith("*/") or prev.startswith("/*"):
                              documented += 1

              total_code += code
              total_comment += comments
              total_functions += functions
              documented_functions += documented
              pct = (comments / max(1, code + comments)) * 100
              print(f"{path}\t{code}\t{comments}\t{pct:.1f}%\t{functions}\t{documented}")

          print()
          print(f"TOTAL code_lines={total_code}")
          print(f"TOTAL comment_lines={total_comment}")
          print(f"TOTAL functions={total_functions}")
          print(f"TOTAL documented_functions={documented_functions}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: final-maintenance-audit
          path: audit/
          if-no-files-found: error
