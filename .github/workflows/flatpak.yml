name: Flatpak

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'include/**'
      - 'assets/**'
      - 'flatpak/**'
      - 'packaging/**'
      - 'CMakeLists.txt'
      - '.github/workflows/flatpak.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'assets/**'
      - 'flatpak/**'
      - 'packaging/**'
      - 'CMakeLists.txt'
      - '.github/workflows/flatpak.yml'

permissions:
  contents: read

jobs:
  flatpak:
    name: Build x86_64 Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Blazzing-x86_64.flatpak
          manifest-path: flatpak/io.github.xoykor.Blazzing.yml
          cache-key: flatpak-builder-${{ github.sha }}
          artifact-name: Blazzing-x86_64.flatpak

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: flatpak
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Flatpak artifact
        uses: actions/download-artifact@v4
        with:
          name: Blazzing-x86_64.flatpak
          path: release

      - name: Prepare release files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mv release/Blazzing-x86_64.flatpak "release/Blazzing-${TAG}-x86_64.flatpak"
          cd release
          sha256sum "Blazzing-${TAG}-x86_64.flatpak" > "Blazzing-${TAG}-x86_64.flatpak.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          ## Blazzing ${TAG}

          ### Flatpak

          Download **Blazzing-${TAG}-x86_64.flatpak** from the assets below.

          Install:

          \`\`\`sh
          flatpak install --user ./Blazzing-${TAG}-x86_64.flatpak
          \`\`\`

          Run:

          \`\`\`sh
          flatpak run io.github.xoykor.Blazzing
          \`\`\`

          The accompanying \`.sha256\` file can be used to verify the download.
          EOF

          gh release create "$TAG" \
            "release/Blazzing-${TAG}-x86_64.flatpak" \
            "release/Blazzing-${TAG}-x86_64.flatpak.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Blazzing ${TAG}" \
            --notes-file release-notes.md
