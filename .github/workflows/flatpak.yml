name: Flatpak

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'include/**'
      - 'assets/**'
      - 'flatpak/**'
      - 'packaging/**'
      - 'CMakeLists.txt'
      - '.github/workflows/flatpak.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'assets/**'
      - 'flatpak/**'
      - 'packaging/**'
      - 'CMakeLists.txt'
      - '.github/workflows/flatpak.yml'

permissions:
  contents: read

jobs:
  flatpak:
    name: Build x86_64 Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Blazzing-x86_64.flatpak
          manifest-path: flatpak/io.github.xoykor.Blazzing.yml
          cache-key: flatpak-builder-${{ github.sha }}
          artifact-name: Blazzing-x86_64.flatpak

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: flatpak
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(sed -nE 's/^project\([^)]* VERSION ([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' CMakeLists.txt | head -n1)"
            test -n "$version"
            tag="v${version}"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Check whether release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "SKIP_RELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Download Flatpak artifact
        if: env.SKIP_RELEASE != 'true'
        uses: actions/download-artifact@v4
        with:
          name: Blazzing-x86_64.flatpak
          path: release

      - name: Prepare release files
        if: env.SKIP_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mv release/Blazzing-x86_64.flatpak "release/Blazzing-${TAG}-x86_64.flatpak"
          cd release
          sha256sum "Blazzing-${TAG}-x86_64.flatpak" > "Blazzing-${TAG}-x86_64.flatpak.sha256"

      - name: Create tag and GitHub Release
        if: env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${TAG}" \
              -f "sha=${GITHUB_SHA}" >/dev/null
          fi

          cat > release-notes.md <<EOF
          ## Blazzing ${TAG}

          ### Flatpak

          Download **Blazzing-${TAG}-x86_64.flatpak** from the assets below.

          Install:

          \`\`\`sh
          flatpak install --user ./Blazzing-${TAG}-x86_64.flatpak
          \`\`\`

          Run:

          \`\`\`sh
          flatpak run io.github.xoykor.Blazzing
          \`\`\`

          The accompanying \`.sha256\` file can be used to verify the download.
          EOF

          gh release create "$TAG" \
            "release/Blazzing-${TAG}-x86_64.flatpak" \
            "release/Blazzing-${TAG}-x86_64.flatpak.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Blazzing ${TAG}" \
            --notes-file release-notes.md
