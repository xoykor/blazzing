name: Windows

on:
  push:
    branches:
      - main
      - fix/windows-desktop-rewrite
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Validate JavaScript syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check js/app.js
          node --check tests/windows-renderer.test.js

      - name: Run Windows architecture tests
        run: npm test

      - name: Bundle current x64 mpv runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force runtime/mpv | Out-Null
          $headers = @{ "User-Agent" = "Blazzing-Windows-CI" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -match '^mpv-x86_64-.*\.7z$' -and $_.name -notmatch 'dev' } | Select-Object -First 1
          if (-not $asset) { throw "No x64 mpv runtime asset was found in the latest release." }
          Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile mpv-runtime.7z
          New-Item -ItemType Directory -Force runtime/mpv/unpacked | Out-Null
          7z x mpv-runtime.7z "-oruntime/mpv/unpacked" -y | Out-Host
          $mpv = Get-ChildItem runtime/mpv/unpacked -Filter mpv.exe -Recurse | Select-Object -First 1
          if (-not $mpv) { throw "mpv.exe was not found after extracting the runtime archive." }
          Copy-Item -Path (Join-Path $mpv.Directory.FullName "*") -Destination runtime/mpv -Recurse -Force
          Remove-Item runtime/mpv/unpacked -Recurse -Force
          Remove-Item mpv-runtime.7z -Force
          if (-not (Test-Path runtime/mpv/mpv.exe)) { throw "Bundled mpv.exe is missing." }

      - name: Package Windows app
        run: npm run dist

      - name: Generate Windows SHA-256 files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blazzing-windows
          path: windows/dist/*
          if-no-files-found: error

      - name: Publish Windows assets to matching GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --repo "${{ github.repository }}"
          Get-ChildItem dist -File | Where-Object {
            $_.Extension -eq ".exe" -or $_.Name.EndsWith(".exe.sha256")
          } | ForEach-Object {
            gh release upload $tag $_.FullName --clobber --repo "${{ github.repository }}"
          }
