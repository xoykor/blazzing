name: Windows

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-cairo
            mingw-w64-x86_64-pango
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-json-c
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libwebp
            mingw-w64-x86_64-qrencode

      - name: Configure and build native C17 Windows app
        run: |
          cmake -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DVIPTV_USE_SDL2=ON
          cmake --build build-win

      - name: Run CTest unit tests
        run: |
          ctest --test-dir build-win --output-on-failure

      - name: Stage Windows portable binaries and MinGW64 DLLs
        run: |
          mkdir -p dist/Blazzing-Windows-x64
          cp build-win/visual-iptv.exe dist/Blazzing-Windows-x64/visual-iptv.exe
          cp build-win/visual-iptv.exe dist/Blazzing-Windows-x64/Blazzing.exe
          cp build-win/vip-thumb-probe.exe dist/Blazzing-Windows-x64/vip-thumb-probe.exe
          ldd build-win/visual-iptv.exe | awk '/\/mingw64\/bin\// { print $3 }' | sort -u | xargs -I{} cp -f "{}" dist/Blazzing-Windows-x64/

      - name: Bundle x64 mpv runtime and create portable ZIP
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist/Blazzing-Windows-x64/mpv | Out-Null
          $headers = @{
            "User-Agent" = "Blazzing-Windows-CI"
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -match '^mpv-x86_64-.*\.7z$' -and $_.name -notmatch 'dev' } | Select-Object -First 1
          if (-not $asset) { throw "No x64 mpv runtime asset was found in the latest release." }
          Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile mpv-runtime.7z
          New-Item -ItemType Directory -Force dist/mpv-unpacked | Out-Null
          7z x mpv-runtime.7z "-odist/mpv-unpacked" -y | Out-Host
          $mpv = Get-ChildItem dist/mpv-unpacked -Filter mpv.exe -Recurse | Select-Object -First 1
          if (-not $mpv) { throw "mpv.exe was not found after extracting the runtime archive." }
          Copy-Item -Path (Join-Path $mpv.Directory.FullName "*") -Destination dist/Blazzing-Windows-x64/mpv -Recurse -Force
          Remove-Item dist/mpv-unpacked -Recurse -Force
          Remove-Item mpv-runtime.7z -Force
          if (-not (Test-Path dist/Blazzing-Windows-x64/mpv/mpv.exe)) { throw "Bundled mpv.exe is missing." }

          $zipPath = "dist/Blazzing-Windows-x64-portable.zip"
          Compress-Archive -Path "dist/Blazzing-Windows-x64/*" -DestinationPath $zipPath -Force
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
          "$hash  Blazzing-Windows-x64-portable.zip" | Set-Content "$zipPath.sha256" -Encoding ascii

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blazzing-windows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: Publish Windows assets to matching GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -match 'project\(visual_iptv_x11 VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            $tag = "v$($Matches[1])"
            gh release view $tag --repo "${{ github.repository }}" 2>$null
            if ($LASTEXITCODE -eq 0) {
              Get-ChildItem dist -File | Where-Object {
                $_.Extension -eq ".zip" -or $_.Name.EndsWith(".zip.sha256")
              } | ForEach-Object {
                gh release upload $tag $_.FullName --clobber --repo "${{ github.repository }}"
              }
            }
          }
