name: Windows

on:
  push:
    branches:
      - main
      - feat/windows-desktop-port
    paths:
      - "windows/**"
      - "tizen/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "tizen/**"
      - ".github/workflows/windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Validate JavaScript syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check js/platform.js
          node --check scripts/prepare-app.js
          node --check tests/prepare-app.test.js

      - name: Validate shared frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run prepare-app
          npm test
          for file in ../tizen/tests/*.test.js; do
            node "$file"
          done

      - name: Package Windows app
        run: npm run dist

      - name: Generate Windows SHA-256 files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blazzing-windows
          path: windows/dist/*
          if-no-files-found: error

      - name: Publish Windows assets to matching GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --repo "${{ github.repository }}"
          Get-ChildItem dist -File | Where-Object {
            $_.Name -match '\.exe(\.sha256)?
          } | ForEach-Object {
            gh release upload $tag $_.FullName --clobber --repo "${{ github.repository }}"
          }
