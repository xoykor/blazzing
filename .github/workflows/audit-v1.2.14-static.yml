name: Static audit v1.2.14

on:
  push:
    branches:
      - audit-v1.2.14
    paths:
      - .github/workflows/audit-v1.2.14-static.yml

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-v1.2.14

      - name: Install analyzers and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck build-essential cmake pkg-config libx11-dev libcurl4-openssl-dev libjson-c-dev libsqlite3-dev libjpeg-dev libpng-dev libwebp-dev libssl-dev ffmpeg mpv

      - name: Cppcheck
        run: |
          cppcheck --enable=warning,performance,portability --std=c11 --inline-suppr --suppress=missingIncludeSystem --suppress=unusedFunction -Iinclude src tests 2>cppcheck.txt || true
          cat cppcheck.txt

      - name: GCC analyzer build
        run: |
          cmake -S . -B build-analyzer -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_C_FLAGS='-fanalyzer -Wno-analyzer-too-complex'
          cmake --build build-analyzer --parallel 2 2>&1 | tee analyzer.txt
