name: Release v1.3.0 prep

on:
  push:
    branches: [revamp-v1.3.0]
    paths:
      - scripts/release-v1.3.0.py
      - .github/workflows/release-v1.3.0-prep.yml

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp-v1.3.0
      - name: Apply release metadata
        run: python3 scripts/release-v1.3.0.py
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc pkg-config libx11-dev libcurl4-openssl-dev libjson-c-dev libsqlite3-dev libjpeg-dev libpng-dev libwebp-dev libssl-dev libcairo2-dev libpango1.0-dev ffmpeg mpv
      - name: Release build and tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Sanitizer build and tests
        run: |
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVIPTV_SANITIZE=ON
          cmake --build build-san
          ctest --test-dir build-san --output-on-failure
      - name: Commit v1.3.0 metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt CHANGELOG.md CHANGELOG.pt-BR.md flatpak/io.github.xoykor.Blazzing.metainfo.xml
          git diff --cached --quiet && exit 0
          git commit -m 'release: prepare Blazzing 1.3.0'
          git push origin HEAD:revamp-v1.3.0
