name: Arch Linux package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'include/**'
      - 'assets/**'
      - 'packaging/**'
      - 'CMakeLists.txt'
      - '.github/workflows/arch.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Arch x86_64 package
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake git libx11 curl json-c sqlite \
            libjpeg-turbo libpng libwebp openssl ffmpeg mpv

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -nE 's/^project\(visual_iptv_x11 VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          fi
          test -n "$VERSION"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/arch/PKGBUILD
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build package with makepkg
        shell: bash
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --noconfirm --cleanbuild"

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp packaging/arch/*.pkg.tar.zst release/
          cd release
          for pkg in *.pkg.tar.zst; do
            sha256sum "$pkg" > "${pkg}.sha256"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: blazzing-arch-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish package to GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Arch package
        uses: actions/download-artifact@v4
        with:
          name: blazzing-arch-${{ needs.build.outputs.version }}
          path: release

      - name: Upload package to matching release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${VERSION}"
          fi

          found=0
          for _ in $(seq 1 30); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              found=1
              break
            fi
            if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
              break
            fi
            sleep 10
          done

          if [[ "$found" -ne 1 ]]; then
            echo "Release $TAG not found; package remains available as a workflow artifact."
            exit 0
          fi

          gh release upload "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          pkg="$(basename "$(find release -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)")"

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > release-body.md

          if ! grep -q '^### Arch Linux / CachyOS$' release-body.md; then
            cat >> release-body.md <<EOF

          ### Arch Linux / CachyOS

          Download **${pkg}** from the assets below.

          Install:

          \`\`\`sh
          sudo pacman -U ./${pkg}
          \`\`\`

          The accompanying \`.sha256\` file can be used to verify the package.
          EOF

            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file release-body.md
          fi
