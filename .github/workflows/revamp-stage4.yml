name: Revamp stage 4

on:
  push:
    branches: [revamp-v1.3.0]
    paths:
      - scripts/revamp-stage4.py
      - .github/workflows/revamp-stage4.yml

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp-v1.3.0
      - name: Apply stage 4 patch
        run: python3 scripts/revamp-stage4.py
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc pkg-config libx11-dev libcurl4-openssl-dev libjson-c-dev libsqlite3-dev libjpeg-dev libpng-dev libwebp-dev libssl-dev libcairo2-dev libpango1.0-dev ffmpeg mpv
      - name: Release build and tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Sanitizer build and tests
        run: |
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVIPTV_SANITIZE=ON
          cmake --build build-san
          ctest --test-dir build-san --output-on-failure
      - name: Commit validated stage 4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt .github/workflows/ci.yml src/ui_x11/x11_app.c
          git diff --cached --quiet && exit 0
          git commit -m 'feat(ui): integrate Cairo and Pango rendering foundation'
          git push origin HEAD:revamp-v1.3.0
