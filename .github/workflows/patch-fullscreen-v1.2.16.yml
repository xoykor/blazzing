name: Patch fullscreen v1.2.16

on:
  push:
    branches: [fix/catalog-routing-v1.2.16]

permissions:
  contents: write

jobs:
  patch-build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fullscreen patch
        run: python3 scripts/patch-fullscreen-v1.2.16.py

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config python3 \
            libx11-dev libcurl4-openssl-dev libjson-c-dev libsqlite3-dev \
            libjpeg-dev libpng-dev libwebp-dev libssl-dev ffmpeg mpv

      - name: Release build and tests
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DVIPTV_SANITIZE=OFF
          cmake --build build-release --parallel 2
          ctest --test-dir build-release --output-on-failure

      - name: Sanitizer build and tests
        run: |
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DVIPTV_SANITIZE=ON
          cmake --build build-san --parallel 2
          ctest --test-dir build-san --output-on-failure

      - name: Commit validated fullscreen patch
        run: |
          if git diff --quiet -- src/ui_x11/x11_app.c; then
            echo "No fullscreen patch changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui_x11/x11_app.c
          git commit -m "fix(player): make fullscreen reliable under KDE X11/XWayland"
          git push origin HEAD:fix/catalog-routing-v1.2.16
