name: AppImage

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'include/**'
      - 'assets/**'
      - 'packaging/**'
      - 'CMakeLists.txt'
      - '.github/workflows/appimage.yml'

permissions:
  contents: read

jobs:
  appimage:
    name: Build x86_64 AppImage
    runs-on: ubuntu-22.04

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config curl wget file patchelf \
            libx11-dev libcurl4-openssl-dev libjson-c-dev libsqlite3-dev \
            libjpeg-dev libpng-dev libwebp-dev libssl-dev \
            ffmpeg mpv

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -nE 's/^project\(visual_iptv_x11 VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Blazzing
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=OFF
          cmake --build build --parallel

      - name: Create AppDir
        run: |
          rm -rf AppDir
          DESTDIR="$PWD/AppDir" cmake --install build

      - name: Download AppImage packaging tools
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy-x86_64.AppImage
          wget -q \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage appimagetool-x86_64.AppImage

      - name: Bundle libraries, mpv and ffmpeg
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/visual-iptv \
            --executable /usr/bin/mpv \
            --executable /usr/bin/ffmpeg \
            --desktop-file packaging/visual-iptv.desktop \
            --icon-file assets/blazzing.png

          # The application launches mpv and ffmpeg by name. Ensure the bundled
          # copies inside the AppImage are found before any host-system copies.
          rm -f AppDir/AppRun
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="$HERE/usr/bin${PATH:+:$PATH}"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export XDG_DATA_DIRS="$HERE/usr/share${XDG_DATA_DIRS:+:$XDG_DATA_DIRS}"
          exec "$HERE/usr/bin/visual-iptv" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          OUT="release/Blazzing-v${VERSION}-x86_64.AppImage"
          ./appimagetool-x86_64.AppImage AppDir "$OUT"
          chmod +x "$OUT"
          sha256sum "$OUT" > "${OUT}.sha256"

      - name: Smoke-test AppImage structure
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APPIMAGE="release/Blazzing-v${VERSION}-x86_64.AppImage"
          "$APPIMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/visual-iptv
          test -x squashfs-root/usr/bin/mpv
          test -x squashfs-root/usr/bin/ffmpeg
          test -x squashfs-root/AppRun
          rm -rf squashfs-root

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: blazzing-appimage-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish AppImage to GitHub Release
    needs: appimage
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: blazzing-appimage-${{ needs.appimage.outputs.version }}
          path: release

      - name: Upload to matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.appimage.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${VERSION}"
          fi

          found=0
          for _ in $(seq 1 30); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              found=1
              break
            fi

            # On a normal push to main there is no reason to wait for a release
            # that does not already exist.
            if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
              break
            fi

            sleep 10
          done

          if [[ "$found" -ne 1 ]]; then
            echo "Release $TAG not found. AppImage remains available as a workflow artifact."
            exit 0
          fi

          gh release upload "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          APPIMAGE="Blazzing-v${VERSION}-x86_64.AppImage"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > release-body.md

          if ! grep -q '^### AppImage$' release-body.md; then
            cat >> release-body.md <<EOF

          ### AppImage

          Download **${APPIMAGE}**, make it executable and run it:

          \`\`\`sh
          chmod +x ./${APPIMAGE}
          ./${APPIMAGE}
          \`\`\`

          The AppImage bundles the Blazzing runtime together with mpv and ffmpeg.
          EOF

            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file release-body.md
          fi
