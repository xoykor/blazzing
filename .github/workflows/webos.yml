name: webOS

on:
  push:
    branches:
      - main
    paths:
      - 'webos/**'
      - 'docs/WEBOS_ARCHITECTURE.md'
      - '.github/workflows/webos.yml'
  pull_request:
    paths:
      - 'webos/**'
      - 'docs/WEBOS_ARCHITECTURE.md'
      - '.github/workflows/webos.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install webOS dependencies
        working-directory: webos
        run: npm install

      - name: Prepare browser vendor files
        working-directory: webos
        run: npm run prepare-app

      - name: Validate release metadata
        working-directory: webos
        run: npm run validate-release

      - name: Validate JavaScript syntax
        run: |
          for file in webos/app/src/*.js webos/service/io.github.xoykor.blazzing.network/*.js; do
            node --check "$file"
          done
          node --check webos/tools/prepare.mjs

      - name: Test M3U parser
        working-directory: webos
        run: npm test

      - name: Validate prepared package inputs
        run: |
          test -f webos/app/index.html
          test -f webos/app/icon.png
          test -f webos/app/css/app.css
          test -f webos/app/vendor/webOSTV.js
          test -f webos/app/vendor/webOSTV-dev.js
          test -f webos/app/vendor/qrcode.js
          test -x webos/prepare.fish
          test -x webos/run-simulator.fish
          test -x webos/package.fish

      - name: Build installable IPK
        working-directory: webos
        run: |
          npm run package-ci
          test "$(find dist -maxdepth 1 -type f -name '*.ipk' | wc -l)" -ge 1
          find dist -maxdepth 1 -type f -name '*.ipk' -print

      - name: Upload webOS IPK
        uses: actions/upload-artifact@v4
        with:
          name: blazzing-webos-ipk
          path: webos/dist/*.ipk
          if-no-files-found: error
          retention-days: 14
