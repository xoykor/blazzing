name: Final maintenance apply

on:
  push:
    branches: [final-maintenance]
    paths:
      - 'scripts/final-maintenance-pass.py'
      - '.github/workflows/final-maintenance-apply.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-maintenance

      - name: Install formatting, analysis and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential cmake ninja-build pkg-config             libx11-dev libcurl4-openssl-dev libjson-c-dev libsqlite3-dev             libjpeg-dev libpng-dev libwebp-dev libssl-dev libcairo2-dev libpango1.0-dev             ffmpeg mpv clang clang-format universal-ctags

      - name: Apply final readability and audit fixes
        run: python3 scripts/final-maintenance-pass.py

      - name: Release build and tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: ASan and UBSan
        run: |
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVIPTV_SANITIZE=ON
          cmake --build build-san
          ctest --test-dir build-san --output-on-failure

      - name: GCC analyzer must be clean for audited warnings
        run: |
          cmake -S . -B build-analyzer -G Ninja             -DCMAKE_BUILD_TYPE=Debug             -DCMAKE_C_FLAGS="-fanalyzer -Wall -Wextra -Wpedantic"
          cmake --build build-analyzer 2>&1 | tee analyzer.log
          if grep -E 'warning:.*(analyzer|discarded-qualifiers|misleading-indentation)' analyzer.log; then
            echo "Audited compiler/analyzer warning remains"
            exit 1
          fi

      - name: Commit validated maintenance pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .clang-format CMakeLists.txt include src tests
          git diff --cached --quiet && exit 0
          git commit -m 'chore: make final codebase human-readable and fully commented'
          git push origin HEAD:final-maintenance
